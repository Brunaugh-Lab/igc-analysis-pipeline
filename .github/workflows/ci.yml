name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.19"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-suffix: tests-${{ matrix.python-version }}

      - name: Install locked dependencies
        run: uv sync --locked --all-extras

      - name: Run tests
        run: uv run pytest -q

  quality:
    name: Lock and lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.19"
          python-version: "3.12"
          enable-cache: true
          cache-suffix: quality

      - name: Verify lockfile
        run: uv lock --check

      - name: Enforce public-release tracked-path boundary
        run: python scripts/check_public_release_boundary.py

      - name: Install locked dependencies
        run: uv sync --locked --all-extras

      - name: Run release-blocking lint checks
        run: uv run ruff check .

  package:
    name: Build and smoke-test distributions
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.19"
          python-version: "3.12"
          enable-cache: true
          cache-suffix: package

      - name: Build source and wheel distributions
        run: uv build

      - name: Smoke-test wheel commands
        run: |
          uv run --isolated --no-project --with dist/*.whl igc-bet --help
          uv run --isolated --no-project --with dist/*.whl igc-dispersive --help
          uv run --isolated --no-project --with dist/*.whl igc-acid-base --help
          uv run --isolated --no-project --with dist/*.whl igc-full-peak --help
          uv run --isolated --no-project --with dist/*.whl igc-report --help
          uv run --isolated --no-project --with dist/*.whl igc-ssa-dose --help
          uv run --isolated --no-project --with dist/*.whl python -c \
            "import importlib.metadata, igc_analysis; assert igc_analysis.__version__ == importlib.metadata.version('igc-analysis-pipeline')"

      - name: Run wheel end to end on synthetic data
        run: |
          uv run --isolated --no-project --with dist/*.whl igc-full-peak \
            --neutral-bundle synthetic=src/igc_analysis/contracts/igc-neutral-data/0.2.0/examples/synthetic_peak_shape \
            --models none,henry \
            --n-cells 40 \
            --n-starts 1 \
            --no-lodo \
            --output wheel-smoke-output
          test -s wheel-smoke-output/full_peak_run.json
          test -s wheel-smoke-output/README.md

          uv run --isolated --no-project --with dist/*.whl igc-bet \
            --synthetic-example \
            --output wheel-bet-smoke-output
          test -s wheel-bet-smoke-output/bet_run.json
          test -s wheel-bet-smoke-output/README.md
          python -c "import json; d=json.load(open('wheel-bet-smoke-output/bet_run.json')); assert d['reportability']['bet_applicable'] is True; assert abs(d['result']['ssa_m2_g'] - 3.793949) < 0.04"

          uv run --isolated --no-project --with dist/*.whl igc-dispersive \
            --synthetic-example \
            --output wheel-dispersive-smoke-output
          test -s wheel-dispersive-smoke-output/dispersive_run.json
          test -s wheel-dispersive-smoke-output/README.md
          python -c "import json; d=json.load(open('wheel-dispersive-smoke-output/dispersive_run.json')); assert d['result']['reportable'] is True; assert abs(d['result']['gamma_d_min_mJm2'] - 40.0) < 0.2"

          uv run --isolated --no-project --with dist/*.whl igc-acid-base \
            --synthetic-example \
            --output wheel-acid-base-smoke-output
          test -s wheel-acid-base-smoke-output/acid_base_run.json
          test -s wheel-acid-base-smoke-output/README.md
          python -c "import json; d=json.load(open('wheel-acid-base-smoke-output/acid_base_run.json')); assert d['result']['reportable'] is True"

          uv run --isolated --no-project --with dist/*.whl igc-report \
            --synthetic-example \
            --output wheel-batch-smoke-output
          test -s wheel-batch-smoke-output/batch_run.json
          test -s wheel-batch-smoke-output/batch_summary.csv
          python -c "import json; d=json.load(open('wheel-batch-smoke-output/batch_run.json')); assert len(d['jobs']) == 4; assert d['jobs'][0]['reportable'] is True"

      - name: Smoke-test source distribution
        run: |
          uv run --isolated --no-project --with dist/*.tar.gz igc-bet --help
          uv run --isolated --no-project --with dist/*.tar.gz igc-dispersive --help
          uv run --isolated --no-project --with dist/*.tar.gz igc-acid-base --help
          uv run --isolated --no-project --with dist/*.tar.gz igc-full-peak --help
          uv run --isolated --no-project --with dist/*.tar.gz igc-report --help
          uv run --isolated --no-project --with dist/*.tar.gz igc-bet \
            --synthetic-example \
            --output sdist-bet-smoke-output
          python -c "import json; d=json.load(open('sdist-bet-smoke-output/bet_run.json')); assert d['reportability']['bet_applicable'] is True; assert abs(d['result']['ssa_m2_g'] - 3.793949) < 0.04"
          uv run --isolated --no-project --with dist/*.tar.gz igc-dispersive \
            --synthetic-example \
            --output sdist-dispersive-smoke-output
          python -c "import json; d=json.load(open('sdist-dispersive-smoke-output/dispersive_run.json')); assert d['result']['reportable'] is True; assert abs(d['result']['gamma_d_min_mJm2'] - 40.0) < 0.2"
          uv run --isolated --no-project --with dist/*.tar.gz igc-acid-base \
            --synthetic-example \
            --output sdist-acid-base-smoke-output
          python -c "import json; d=json.load(open('sdist-acid-base-smoke-output/acid_base_run.json')); assert d['result']['reportable'] is True"
          uv run --isolated --no-project --with dist/*.tar.gz igc-report \
            --synthetic-example \
            --output sdist-batch-smoke-output
          python -c "import json; d=json.load(open('sdist-batch-smoke-output/batch_run.json')); assert len(d['jobs']) == 4"

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.19"
          python-version: "3.12"
          enable-cache: true
          cache-suffix: dependency-audit

      - name: Install locked audit tooling
        run: uv sync --locked --all-extras

      - name: Export and audit locked runtime dependencies
        run: |
          uv export --locked --no-dev --no-emit-project \
            --output-file locked-runtime-requirements.txt
          uv run pip-audit --requirement locked-runtime-requirements.txt
