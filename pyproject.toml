[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "igc-analysis-pipeline"
version = "2026.7.31"
description = "Source-neutral analysis toolkit for inverse gas chromatography data"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Ashlee Brunaugh", email = "brunaugh@umich.edu" },
]
maintainers = [
    { name = "Ashlee Brunaugh", email = "brunaugh@umich.edu" },
]
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "scipy>=1.10",
]

[project.urls]
Homepage = "https://github.com/Brunaugh-Lab/igc-analysis-pipeline"
Repository = "https://github.com/Brunaugh-Lab/igc-analysis-pipeline"
Issues = "https://github.com/Brunaugh-Lab/igc-analysis-pipeline/issues"

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "pip-audit==2.10.1",
    "pytest>=7.0",
    "ruff==0.16.1",
]

[project.scripts]
igc-full-peak = "igc_analysis.cli.full_peak:main"
igc-ssa-dose = "igc_analysis.cli.geometric_ssa:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
igc_analysis = [
    "contracts/**/*.json",
    "contracts/**/*.md",
    "contracts/**/*.csv",
    "contracts/**/validate_bundle.py",
]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
# Start with release-blocking syntax and undefined-name checks. Broader style
# adoption should be a separate, reviewable cleanup.
select = ["E9", "F63", "F7", "F82"]
